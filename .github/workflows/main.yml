name: Build Arabic Letters Game APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check game
        run: |
          test -f index.html
          echo "index.html found"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create app
        run: |
          cordova create app com.yarubacademy.arabicletters "تعلم الحروف العربية"

      - name: Copy game
        run: |
          rm -rf app/www/*
          cp index.html app/www/index.html

      - name: Add Android
        working-directory: app
        run: cordova platform add android@15.0.0

      - name: Build APK
        working-directory: app
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Letters-Game-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
